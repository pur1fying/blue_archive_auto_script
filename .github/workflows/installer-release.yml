name: Build BAAS installer

on:
  pull_request:
    paths:
      - 'deploy/installer/**'
      - 'core/ocr/baas_ocr_client/server_installer.py'
      - '.github/workflows/installer-release.yml'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish/update a GitHub Release using this ref
        required: false
        default: false
        type: boolean
      release_tag:
        description: Release tag beginning with v (required when publishing manually)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            asset: BAAS-Installer-windows-x64.exe
            triplet: x64-windows-static
            publish: true
          - os: ubuntu-22.04
            asset: BAAS-Installer-linux-x64
            triplet: x64-linux
            publish: true
          - os: macos-15-intel
            asset: BAAS-Installer-macos-x64
            triplet: x64-osx
            publish: false
          - os: macos-14
            asset: BAAS-Installer-macos-arm64
            triplet: arm64-osx
            publish: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'deploy/installer/vcpkg.json'
      - name: Configure
        run: >-
          cmake -S deploy/installer -B build/installer
          -DCMAKE_BUILD_TYPE=Release
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build/installer --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/installer -C Release --output-on-failure
      - name: Normalize release asset name
        shell: pwsh
        run: |
          $candidate = if ('${{ runner.os }}' -eq 'Windows') { 'build/installer/Release/BlueArchiveAutoScript.exe' } else { 'build/installer/BlueArchiveAutoScript' }
          if (!(Test-Path $candidate)) { $candidate = if ('${{ runner.os }}' -eq 'Windows') { 'build/installer/BlueArchiveAutoScript.exe' } else { 'build/installer/BlueArchiveAutoScript' } }
          if (!(Test-Path $candidate)) { throw "Installer executable was not produced: $candidate" }
          Copy-Item $candidate '${{ matrix.asset }}'
      - uses: actions/upload-artifact@v4
        if: matrix.publish
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.release_tag }}' } else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v\S+$') { throw "Release tag must begin with v: '$tag'" }
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release-assets -File | Sort-Object Name
          if ($files.Count -ne 3) { throw "Expected three supported installer assets, got $($files.Count)" }
          $files | ForEach-Object { "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)" } | Set-Content release-assets/SHA256SUMS
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
