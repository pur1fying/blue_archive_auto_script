name: Plugin API and worker lifecycle

on:
  pull_request:
    paths:
      - 'service/**'
      - 'tests/service/test_plugin*.py'
      - 'examples/plugins/**'
      - '.github/workflows/plugins.yml'
  push:
    branches: [master, 'codex/feat-plugin-system']
    paths:
      - 'service/**'
      - 'tests/service/test_plugin*.py'
      - 'examples/plugins/**'
      - '.github/workflows/plugins.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Plugin contract (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install service contract test dependencies
        run: >-
          python -m pip install pytest httpx fastapi "pydantic<3" requests rich
          watchfiles tomli tomli-w cryptography pynacl websockets psutil
          "pygit2==1.15.1; python_version < '3.10'"
          "pygit2; python_version >= '3.10'"
      - name: Verify manifests, authentication and real worker cleanup
        run: >-
          python -m pytest -q
          tests/service/test_plugins.py
          tests/service/test_plugins_transport.py
          tests/service/test_plugins_runtime.py
          tests/service/test_plugins_android.py
          tests/service/test_plugin_bundles.py
